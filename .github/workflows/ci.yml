name: Enterprise Legal RAG Platform CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff

      - name: Code Quality & Linting
        run: |
          ruff check backend/src backend/tests --ignore E501

      - name: Run Full Automated Test Suite (Unit, Integration, API Tests)
        env:
          ENVIRONMENT: test
          CHROMA_DB_PATH: ./backend/chroma_db_test
          DATABASE_URL: sqlite:///./backend/test_chatbot.db
        run: |
          python -m pytest backend/tests -v --tb=short

  docker-verification:
    name: Production Container Image Verification
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Production Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: legal-rag-backend:latest

      - name: Build Frontend Production Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: legal-rag-frontend:latest
